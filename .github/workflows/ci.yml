name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

env:
  # Previews are served at <name>-github-reviews.<subdomain>.workers.dev.
  WORKERS_SUBDOMAIN: hugomrdias

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reviews.hugodias.me
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Migrations run first, so they must stay compatible with the code still serving traffic.
      - run: pnpm db:migrate:remote
      - run: pnpm build
      - run: pnpm exec wrangler deploy

  preview:
    needs: check
    # Fork pull requests get no secrets, so they get no Preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Previews share one database, so a pull request's new migrations land there before it merges.
      - run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.preview-migrations.jsonc
      - run: pnpm build
      - id: preview
        name: Create or update the Preview
        run: |
          set -o pipefail
          app_url="https://${PREVIEW_NAME}-github-reviews.${WORKERS_SUBDOMAIN}.workers.dev"
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --var "APP_URL:$app_url" --json)"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -r '.preview.urls[0] // empty')"
          if [ -z "$url" ]; then
            echo "::error::Cloudflare returned no Preview URL. Check that preview URLs are enabled for the github-reviews Worker (preview_urls in wrangler.jsonc, applied by wrangler deploy)."
            exit 1
          fi
          # APP_URL drives the OAuth callback, so it has to be the URL Cloudflare actually serves.
          if [ "${url%/}" != "$app_url" ]; then
            echo "::error::Preview is at $url, but APP_URL was set to $app_url. Check WORKERS_SUBDOMAIN."
            exit 1
          fi
          echo "url=$app_url" >> "$GITHUB_OUTPUT"
      - name: Comment the Preview URL
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Delete the Preview
        # A pull request whose checks never passed has no Preview to delete.
        continue-on-error: true
        run: pnpm exec wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
